<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="kopi-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#8a3e06"/>
    </linearGradient>
  </defs>

  <!-- warm amber badge -->
  <rect width="32" height="32" rx="8" fill="url(#kopi-bg)"/>

  <!-- rising steam -->
  <path d="M13.4 11c-1.1-1.4 1.1-2.3 0-3.7" stroke="#ffffff" stroke-width="1.7"
        fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M18.6 11c-1.1-1.4 1.1-2.3 0-3.7" stroke="#ffffff" stroke-width="1.7"
        fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- cup handle -->
  <path d="M22.6 15.4c1.9-.1 3.2.9 3.2 2.3 0 1.4-1.3 2.4-3 2.3" stroke="#ffffff"
        stroke-width="1.7" fill="none" stroke-linecap="round"/>

  <!-- traditional kopi cup -->
  <path d="M8.8 13.6H23.2V15.2C23.2 19.2 20.2 21.8 16 21.8C11.8 21.8 8.8 19.2 8.8 15.2Z"
        fill="#ffffff"/>

  <!-- hint of kopi inside the cup -->
  <path d="M10.9 15.6h10.2" stroke="#b45309" stroke-width="1.4"
        stroke-linecap="round" opacity="0.35"/>

  <!-- saucer -->
  <path d="M9.6 24.8h12.8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
